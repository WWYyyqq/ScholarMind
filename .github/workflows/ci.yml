name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lock, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCHOLARMIND_TEST_DATABASE_DSN: postgresql://scholarmind:scholarmind-ci@localhost:5432/scholarmind_test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scholarmind_test
          POSTGRES_USER: scholarmind
          POSTGRES_PASSWORD: scholarmind-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarmind -d scholarmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra postgres

      - name: Lint
        run: |
          uv run ruff check src/scholarmind tests/unit tests/integration
          uv run ruff check --select F \
            src/open_deep_research/deep_researcher.py \
            src/open_deep_research/state.py \
            scripts/run_baseline.py

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run PostgreSQL and pgvector integration test
        run: uv run pytest tests/integration/test_postgres_repository.py
